# Drop-in for the production unit when the chestnut dock is tunneled over USB4 (GPU under amdgpu/KFD instead of the USB3 AM path).
# install: sudo mkdir -p /etc/systemd/system/tinygrad-server-chestnut.service.d && sudo cp kfd.conf there && sudo systemctl daemon-reload && sudo systemctl restart tinygrad-server-chestnut
# The frozen venv must have been reinstalled from a tree that has the KFD iface (any tree since the hcq2 rewrite does); verify first:
#   cd / && /home/jacob/z/tinygrad-serve/bin/python3 -c "import tinygrad.llm.cli"
[Service]
Environment=DEV=KFD+AMD:LLVM
Environment=MTP_DRAFT_VOCAB=65536
